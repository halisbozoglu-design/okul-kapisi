name: Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build:web

      - name: Create and sync Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build installable APK and test AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug bundleDebug

      - name: Prepare stable download names
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MIMAROS-Android-Test.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab MIMAROS-Android-Test.aab

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimaros-android-apk
          path: MIMAROS-Android-Test.apk
          if-no-files-found: error

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimaros-android-aab
          path: MIMAROS-Android-Test.aab
          if-no-files-found: error

      - name: Publish stable Android test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-latest
          name: MİMAROS Android Test
          prerelease: true
          make_latest: false
          files: |
            MIMAROS-Android-Test.apk
            MIMAROS-Android-Test.aab
          overwrite_files: true
          body: |
            MİMAROS Android gerçek cihaz test paketi.
            APK telefona doğrudan kurulabilir. AAB mağaza/test dağıtımı içindir.
            Bu sürüm main dalındaki en güncel Android test build'idir.

